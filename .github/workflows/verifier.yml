# Correcteur automatique : se déclenche quand quelqu'un commente /verifier
# sur une issue de mission, examine le dépôt et répond en commentaire.
name: Vérifier une mission

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  verifier:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '/verifier') &&
      contains(join(github.event.issue.labels.*.name, ','), 'mission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corriger la mission
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python atelier/verifier.py
